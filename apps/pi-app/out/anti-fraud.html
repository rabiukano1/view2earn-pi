className\":\"pi-policy-p\",\"children\":\"This Policy applies to all users of the View2Earn website, mobile applications, and related services, regardless of their location or the blockchain ecosystem they use.\"}],[\"$\",\"p\",\"5\",{\"className\":\"pi-policy-p\",\"children\":\"By creating an account or using the Service, you agree to comply with this Anti-Fraud Policy, our Terms of Service, Privacy Policy, and all other applicable platform policies.\"}],[\"$\",\"p\",\"6\",{\"className\":\"pi-policy-p\",\"children\":\"Failure to comply with this Policy may result in warnings, reward forfeiture, account suspension, permanent account termination, or other actions permitted by applicable law.\"}],\"$L5\",\"$L6\",\"$L7\",\"$L8\",\"$L9\",\"$La\",\"$Lb\",\"$Lc\",\"$Ld\",\"$Le\",\"$Lf\",\"$L10\",\"$L11\",\"$L12\",\"$L13\",\"$L14\",\"$L15\",\"$L16\",\"$L17\",\"$L18\",\"$L19\",\"$L1a\",\"$L1b\",\"$L1c\",\"$L1d\",\"$L1e\",\"$L1f\",\"$L20\",\"$L21\",\"$L22\",\"$L23\",\"$L24\",\"$L25\",\"$L26\",\"$L27\",\"$L28\",\"$L29\",\"$L2a\",\"$L2b\",\"$L2c\",\"$L2d\",\"$L2e\",\"$L2f\",\"$L30\",\"$L31\",\"$L32\",\"$L33\",\"$L34\",\"$L35\",\"$L36\",\"$L37\",\"$L38\",\"$L39\",\"$L3a\",\"$L3b\",\"$L3c\",\"$L3d\",\"$L3e\",\"$L3f\",\"$L40\",\"$L41\",\"$L42\",\"$L43\",\"$L44\",\"$L45\",\"$L46\",\"$L47\",\"$L48\",\"$L49\",\"$L4a\",\"$L4b\",\"$L4c\",\"$L4d\",\"$L4e\",\"$L4f\",\"$L50\",\"$L51\",\"$L52\",\"$L53\",\"$L54\",\"$L55\",\"$L56\",\"$L57\",\"$L58\",\"$L59\",\"$L5a\",\"$L5b\",\"$L5c\",\"$L5d\",\"$L5e\",\"$L5f\",\"$L60\",\"$L61\",\"$L62\",\"$L63\",\"$L64\",\"$L65\",\"$L66\",\"$L67\",\"$L68\",\"$L69\",\"$L6a\",\"$L6b\",\"$L6c\",\"$L6d\",\"$L6e\",\"$L6f\",\"$L70\",\"$L71\",\"$L72\",\"$L73\",\"$L74\",\"$L75\",\"$L76\",\"$L77\",\"$L78\",\"$L79\",\"$L7a\",\"$L7b\",\"$L7c\",\"$L7d\",\"$L7e\",\"$L7f\",\"$L80\",\"$L81\",\"$L82\",\"$L83\",\"$L84\",\"$L85\",\"$L86\",\"$L87\",\"$L88\",\"$L89\",\"$L8a\",\"$L8b\",\"$L8c\",\"$L8d\",\"$L8e\",\"$L8f\",\"$L90\",\"$L91\",\"$L92\",\"$L93\",\"$L94\",\"$L95\",\"$L96\",\"$L97\",\"$L98\",\"$L99\",\"$L9a\",\"$L9b\",\"$L9c\",\"$L9d\",\"$L9e\",\"$L9f\",\"$La0\",\"$La1\",\"$La2\"]}],\"$La3\"]}]]}],null,\"$La4\"]}],{},null,false]},null,false]},null,false],\"$La5\",false]],\"m\":\"$undefined\",\"G\":[\"$a6\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"a7:I[5104,[],\"OutletBoundary\"]\na9:I[7158,[],\"AsyncMetadataOutlet\"]\nab:I[5104,[],\"ViewportBoundary\"]\nad:I[5104,[],\"MetadataBoundary\"]\nae:\"$Sreact.suspense\"\n5:[\"$\",\"h2\",\"7\",{\"className\":\"pi-policy-h\",\"children\":\"2. Purpose of the Policy\"}]\n6:[\"$\",\"p\",\"8\",{\"className\":\"pi-policy-p\",\"children\":\"The purpose of this Anti-Fraud Policy is to protect the integrity, security, and fairness of the View2Earn platform by preventing, detecting, investigating, and responding to fraudulent, deceptive, or abusive activities.\"}]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"p\",\"9\",{\"className\":\"pi-policy-p\",\"children\":\"Specifically, this Policy is intended to protect legitimate users from unfair competition and fraudulent activities; safeguard advertisers, survey providers, and business partners from invalid traffic, fake engagements, and reward abuse; prevent multiple-account abuse, identity fraud, automated activity, and other forms of platform manipulation; preserve the accuracy and integrity of Reward Points, referrals, surveys, advertisements, and promotional campaigns; promote transparency, accountability, and ethical conduct; support compliance with applicable laws and industry standards; and protect the reputation, reliability, and long-term sustainability of the View2Earn platform.\"}]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"p\",\"10\",{\"className\":\"pi-policy-p\",\"children\":\"This Policy applies equally to all users, regardless of their location, account type, referral status, blockchain ecosystem, or level of activity. No user, partner, or participant is exempt from the standards set out in this Policy.\"}]\n9:[\"$\",\"p\",\"11\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn reserves the right to investigate suspected fraudulent or abusive conduct and to take appropriate action whenever necessary to protect the Service, its users, and its business partners.\"}]\na:[\"$\",\"h2\",\"12\",{\"className\":\"pi-policy-h\",\"children\":\"3. Prohibited Activities\"}]\nb:[\"$\",\"p\",\"13\",{\"className\":\"pi-policy-p\",\"children\":\"To protect the integrity, fairness, and security of the Service, users must not engage in any fraudulent, deceptive, abusive, or dishonest activity. The following activities are strictly prohibited. This list is intended to provide examples and is not exhaustive. View2Earn reserves the right to determine whether any conduct violates this Policy.\"}]\nc:[\"$\",\"h3\",\"14\",{\"className\":\"pi-policy-s\",\"children\":\"3.1 Multiple Accounts\"}]\nd:[\"$\",\"p\",\"15\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not create, own, control, or operate more than one account unless expressly authorized by View2Earn in writing. This includes creating additional accounts using different email addresses, devices, phone numbers, wallets, identities, or any other method intended to bypass platform restrictions.\"}]\ne:[\"$\",\"h3\",\"16\",{\"className\":\"pi-policy-s\",\"children\":\"3.2 Identity Misrepresentation\"}]\nf:[\"$\",\"p\",\"17\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not impersonate another person or organization, provide false/misleading/stolen identity information, use another person's account without authorization, or misrepresent their eligibility to participate in tasks, surveys, or promotional campaigns.\"}]\n10:[\"$\",\"h3\",\"18\",{\"className\":\"pi-policy-s\",\"children\":\"3.3 Automated Activity\"}]\n11:[\"$\",\"p\",\"19\",{\"className\":\"pi-policy-p\",\"children\":\"The use of bots, scrip"])</script><script>self.__next_f.push([1,"ts, automation tools, click farms, artificial intelligence systems, browser automation, emulators, macros, or any other technology designed to automate participation or manipulate the Service is strictly prohibited unless expressly authorized by View2Earn.\"}]\n12:[\"$\",\"h3\",\"20\",{\"className\":\"pi-policy-s\",\"children\":\"3.4 Fraudulent Task Completion\"}]\n13:[\"$\",\"p\",\"21\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not submit false or misleading evidence of task completion, upload edited/manipulated/fabricated screenshots, falsify survey responses, complete tasks without meeting the stated requirements, or attempt to obtain rewards through deception.\"}]\n14:[\"$\",\"h3\",\"22\",{\"className\":\"pi-policy-s\",\"children\":\"3.5 Reward Manipulation\"}]\n15:[\"$\",\"p\",\"23\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not attempt to obtain Reward Points or rewards through dishonest means, including exploiting software bugs or vulnerabilities, manipulating referrals or promotional campaigns, artificially increasing engagement metrics, circumventing reward eligibility requirements, or attempting duplicate reward claims.\"}]\n16:[\"$\",\"h3\",\"24\",{\"className\":\"pi-policy-s\",\"children\":\"3.6 Referral Abuse\"}]\n17:[\"$\",\"p\",\"25\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not create fake referral accounts, refer themselves using multiple accounts, purchase or sell referrals, use automated systems to generate referrals, or manipulate referral rewards through fraudulent activity.\"}]\n18:[\"$\",\"h3\",\"26\",{\"className\":\"pi-policy-s\",\"children\":\"3.7 Survey and Advertising Fraud\"}]\n19:[\"$\",\"p\",\"27\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not submit dishonest or inconsistent survey responses, attempt surveys intended for users who do not meet the eligibility criteria, use VPNs/proxies/virtual machines or other methods to disguise their true location where prohibited, interfere with advertisers' campaigns or survey providers' systems, or generate invalid traffic, fake impressions, or artificial engagement.\"}]\n1a:[\"$\",\"h3\",\"28\",{\"className\":"])</script><script>self.__next_f.push([1,"\"pi-policy-s\",\"children\":\"3.8 Platform Abuse\"}]\n1b:[\"$\",\"p\",\"29\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not attempt to interfere with the normal operation of the Service, reverse engineer/exploit/test platform vulnerabilities without authorization, introduce malware/viruses or other harmful software, launch denial-of-service attacks or similar disruptive activities, or circumvent security measures or access controls.\"}]\n1c:[\"$\",\"h3\",\"30\",{\"className\":\"pi-policy-s\",\"children\":\"3.9 Account Trading and Unauthorized Transfers\"}]\n1d:[\"$\",\"p\",\"31\",{\"className\":\"pi-policy-p\",\"children\":\"Unless expressly permitted by View2Earn, users may not buy, sell, rent, lease, or transfer accounts, share accounts with other individuals, or allow unauthorized persons to access their accounts. Account holders remain responsible for all activity occurring under their accounts.\"}]\n1e:[\"$\",\"h3\",\"32\",{\"className\":\"pi-policy-s\",\"children\":\"3.10 Abuse of Blockchain Ecosystems\"}]\n1f:[\"$\",\"p\",\"33\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not use the Service to engage in fraudulent or deceptive activities involving supported blockchain ecosystems, including Pi Network, Sidra Chain, or any future supported ecosystem. View2Earn does not permit any activity that violates the rules, policies, or integrity of those independent ecosystems.\"}]\n20:[\"$\",\"h3\",\"34\",{\"className\":\"pi-policy-s\",\"children\":\"3.11 Circumvention of Platform Controls\"}]\n21:[\"$\",\"p\",\"35\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not attempt to bypass fraud detection systems, eligibility requirements, account restrictions, security measures, verification procedures, or enforcement actions implemented by View2Earn.\"}]\n22:[\"$\",\"h3\",\"36\",{\"className\":\"pi-policy-s\",\"children\":\"3.12 Any Other Fraudulent Conduct\"}]\n23:[\"$\",\"p\",\"37\",{\"className\":\"pi-policy-p\",\"children\":\"Any activity that View2Earn reasonably determines to be fraudulent, deceptive, abusive, unethical, or harmful to the Service, its users, advertisers, survey providers, business partners, or th"])</script><script>self.__next_f.push([1,"e broader ecosystem may be treated as a violation of this Policy, even if it is not specifically listed above.\"}]\n24:[\"$\",\"h2\",\"38\",{\"className\":\"pi-policy-h\",\"children\":\"4. Fraud Detection and Monitoring\"}]\n25:[\"$\",\"p\",\"39\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn actively monitors the Service to detect, prevent, investigate, and respond to fraudulent, deceptive, abusive, or unauthorized activities. Our fraud detection systems are designed to protect legitimate users, advertisers, survey providers, business partners, and the integrity of the View2Earn platform. Monitoring is conducted in accordance with our Privacy Policy, applicable laws, and our commitment to protecting user privacy.\"}]\n26:[\"$\",\"h3\",\"40\",{\"className\":\"pi-policy-s\",\"children\":\"4.1 Fraud Detection Methods\"}]\n27:[\"$\",\"p\",\"41\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn may use automated systems, manual reviews, and other reasonable security measures to identify suspicious activities, including multiple-account detection, device and network analysis, login and authentication monitoring, unusual account or reward activity, referral pattern analysis, survey and task verification, risk scoring and behavioral analysis, and security event logging and monitoring.\"}]\n28:[\"$\",\"h3\",\"42\",{\"className\":\"pi-policy-s\",\"children\":\"4.2 Risk Assessment\"}]\n29:[\"$\",\"p\",\"43\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn may evaluate account activity to determine whether it presents an elevated risk to the platform. Risk indicators may include unusual activity patterns, inconsistent information, repeated policy violations, or other behaviors reasonably associated with fraudulent conduct. A higher risk assessment does not automatically mean that fraud has occurred; additional review may be conducted before any enforcement action is taken.\"}]\n2a:[\"$\",\"h3\",\"44\",{\"className\":\"pi-policy-s\",\"children\":\"4.3 Manual Review\"}]\n2b:[\"$\",\"p\",\"45\",{\"className\":\"pi-policy-p\",\"children\":\"Certain activities may be reviewed by authorized members of the View2Earn team to"])</script><script>self.__next_f.push([1," verify compliance with this Policy. Manual reviews may include verification of submitted evidence, review of account history, investigation of reported violations, confirmation of reward eligibility, and examination of suspicious transactions or activities.\"}]\n2c:[\"$\",\"h3\",\"46\",{\"className\":\"pi-policy-s\",\"children\":\"4.4 Temporary Restrictions\"}]\n2d:[\"$\",\"p\",\"47\",{\"className\":\"pi-policy-p\",\"children\":\"Where suspicious activity is detected, View2Earn may temporarily restrict certain account features while an investigation is conducted. Such restrictions may include temporary suspension of reward redemptions, delayed processing of rewards, additional identity or account verification, temporary account limitations, or temporary suspension of specific platform features. These measures are intended to protect both users and the integrity of the Service and do not necessarily indicate that a policy violation has been confirmed.\"}]\n2e:[\"$\",\"h3\",\"48\",{\"className\":\"pi-policy-s\",\"children\":\"4.5 Cooperation with Service Providers\"}]\n2f:[\"$\",\"p\",\"49\",{\"className\":\"pi-policy-p\",\"children\":\"Where necessary, View2Earn may work with trusted service providers, advertisers, survey providers, security partners, and fraud prevention services to verify suspicious activities and protect the platform. Information shared for fraud prevention purposes will be limited to what is reasonably necessary and handled in accordance with our Privacy Policy and applicable law.\"}]\n30:[\"$\",\"h3\",\"50\",{\"className\":\"pi-policy-s\",\"children\":\"4.6 Continuous Improvement\"}]\n31:[\"$\",\"p\",\"51\",{\"className\":\"pi-policy-p\",\"children\":\"Fraud techniques continue to evolve. View2Earn regularly reviews and improves its fraud detection systems, monitoring procedures, and security practices to address emerging threats and maintain a fair and secure platform for all users. View2Earn reserves the right to introduce new fraud prevention technologies and monitoring measures as necessary, provided they are implemented in accordance with applicable laws and our Privacy Poli"])</script><script>self.__next_f.push([1,"cy.\"}]\n32:[\"$\",\"h2\",\"52\",{\"className\":\"pi-policy-h\",\"children\":\"5. Investigations\"}]\n33:[\"$\",\"p\",\"53\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn takes all reports and indicators of suspected fraud seriously. When potential fraudulent, deceptive, abusive, or unauthorized activity is identified, we may conduct an investigation to determine whether this Anti-Fraud Policy, our Terms of Service, or other applicable platform policies have been violated. All investigations are conducted in good faith, fairly, consistently, and in accordance with applicable laws and our Privacy Policy.\"}]\n34:[\"$\",\"h3\",\"54\",{\"className\":\"pi-policy-s\",\"children\":\"5.1 Initiation of an Investigation\"}]\n35:[\"$\",\"p\",\"55\",{\"className\":\"pi-policy-p\",\"children\":\"An investigation may be initiated for reasons including, but not limited to, automated fraud detection alerts, reports submitted by users/advertisers/survey providers/business partners, suspicious account activity, unusual reward or referral patterns, verification failures, or suspected violations of this Policy or other platform rules. The initiation of an investigation does not necessarily mean that a violation has occurred.\"}]\n36:[\"$\",\"h3\",\"56\",{\"className\":\"pi-policy-s\",\"children\":\"5.2 Information Reviewed\"}]\n37:[\"$\",\"p\",\"57\",{\"className\":\"pi-policy-p\",\"children\":\"As part of an investigation, View2Earn may review information reasonably necessary to determine the facts, including account information, activity history, reward and redemption records, referral activity, survey and task completion records, device and technical information, login history, communications with our support team, and other relevant records relating to the suspected activity. Only information reasonably necessary for the investigation will be reviewed.\"}]\n38:[\"$\",\"h3\",\"58\",{\"className\":\"pi-policy-s\",\"children\":\"5.3 User Cooperation\"}]\n39:[\"$\",\"p\",\"59\",{\"className\":\"pi-policy-p\",\"children\":\"Users are expected to cooperate with legitimate investigations conducted by View2Earn. During an investigation, we may"])</script><script>self.__next_f.push([1," request additional information or documentation to verify account ownership, eligibility, or compliance with this Policy. Failure to respond within a reasonable period or the submission of false or misleading information may affect the outcome of the investigation.\"}]\n3a:[\"$\",\"h3\",\"60\",{\"className\":\"pi-policy-s\",\"children\":\"5.4 Temporary Measures\"}]\n3b:[\"$\",\"p\",\"61\",{\"className\":\"pi-policy-p\",\"children\":\"To protect the Service while an investigation is ongoing, View2Earn may temporarily suspend reward processing, delay reward redemption, restrict access to certain platform features, require additional identity or account verification, or place an account under temporary review. These measures are precautionary and do not, by themselves, indicate that a policy violation has been confirmed.\"}]\n3c:[\"$\",\"h3\",\"62\",{\"className\":\"pi-policy-s\",\"children\":\"5.5 Investigation Outcomes\"}]\n3d:[\"$\",\"p\",\"63\",{\"className\":\"pi-policy-p\",\"children\":\"After completing an investigation, View2Earn may determine that no violation occurred and remove any temporary restrictions; that additional information is required before a final decision can be made; or that a policy violation occurred, resulting in appropriate enforcement action under this Anti-Fraud Policy or our Terms of Service.\"}]\n3e:[\"$\",\"h3\",\"64\",{\"className\":\"pi-policy-s\",\"children\":\"5.6 Confidentiality\"}]\n3f:[\"$\",\"p\",\"65\",{\"className\":\"pi-policy-p\",\"children\":\"To protect the effectiveness of our fraud prevention efforts, View2Earn may limit the information disclosed about investigations, detection methods, evidence, or internal decision-making processes. We are not required to disclose confidential security procedures, fraud detection technologies, or investigative techniques that could compromise the security or integrity of the Service.\"}]\n40:[\"$\",\"h3\",\"66\",{\"className\":\"pi-policy-s\",\"children\":\"5.7 Recordkeeping\"}]\n41:[\"$\",\"p\",\"67\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn may retain records relating to investigations for an appropriate period where necessary to m"])</script><script>self.__next_f.push([1,"aintain platform security, prevent repeated fraudulent activity, resolve disputes, comply with legal or regulatory obligations, or enforce our legal rights and platform policies. Such records will be handled in accordance with our Privacy Policy and applicable data protection laws.\"}]\n42:[\"$\",\"h2\",\"68\",{\"className\":\"pi-policy-h\",\"children\":\"6. Enforcement Actions\"}]\n43:[\"$\",\"p\",\"69\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn reserves the right to take appropriate enforcement action whenever we reasonably determine that a user has violated this Anti-Fraud Policy, our Terms of Service, or any other applicable platform policy. The enforcement action taken will depend on the nature, severity, frequency, and impact of the violation, as well as any other relevant circumstances.\"}]\n44:[\"$\",\"h3\",\"70\",{\"className\":\"pi-policy-s\",\"children\":\"6.1 Types of Enforcement Actions\"}]\n45:[\"$\",\"p\",\"71\",{\"className\":\"pi-policy-p\",\"children\":\"Depending on the circumstances, View2Earn may issue a warning or educational notice, require additional account or identity verification, temporarily restrict access to certain features, delay or suspend reward processing or redemption, remove/adjust/cancel Reward Points obtained in violation of this Policy, cancel rewards earned through fraudulent or abusive activity, suspend an account for a specified period, permanently terminate an account, restrict participation in specific campaigns/surveys/promotional activities, or take any other reasonable action necessary to protect the Service.\"}]\n46:[\"$\",\"h3\",\"72\",{\"className\":\"pi-policy-s\",\"children\":\"6.2 Recovery of Improper Benefits\"}]\n47:[\"$\",\"p\",\"73\",{\"className\":\"pi-policy-p\",\"children\":\"If View2Earn determines that Reward Points, rewards, bonuses, referral benefits, or other advantages were obtained through fraud, deception, abuse, or policy violations, we may reverse the affected transactions, remove improperly earned Reward Points, cancel pending or future rewards related to the violation, or recover benefits obtained through fraudulent"])</script><script>self.__next_f.push([1," activity where permitted by applicable law.\"}]\n48:[\"$\",\"h3\",\"74\",{\"className\":\"pi-policy-s\",\"children\":\"6.3 Repeat Violations\"}]\n49:[\"$\",\"p\",\"75\",{\"className\":\"pi-policy-p\",\"children\":\"Users who repeatedly violate this Anti-Fraud Policy, even where individual violations are relatively minor, may be subject to increasingly severe enforcement actions, including permanent account termination. Repeated violations demonstrate a pattern of non-compliance that may threaten the integrity of the Service.\"}]\n4a:[\"$\",\"h3\",\"76\",{\"className\":\"pi-policy-s\",\ ervice, and other platform policies to protect the Service, our users, advertisers, survey providers, business partners, and the broader View2Earn ecosystem.\"}]\n52:[\"$\",\"h2\",\"84\",{\"className\":\"pi-policy-h\",\"children\":\"7. Appeals and Reviews\"}]\n53:[\"$\",\"p\",\"85\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn is committed to enforcing this Anti-Fraud Policy fairly, consistently, and responsibly. If you believe that an enforcement action has been taken in error, you may request a review of the decision in accordance with this section. Submitting an appeal does not guarantee that the original decision will be changed or reversed.\"}]\n54:[\"$\",\"h3\",\"86\",{\"className\":\"pi-policy-s\",\"children\":\"7.1 Right to Request a Review\"}]\n55:[\"$\",\"p\",\"87\",{\"className\":\"pi-policy-p\",\"children\":\"Users may request a review of certain enforcement actions, including account suspensions, permanent account terminations, reward cancellations or forfeitures, Reward Point adjustments, participation restrictions, and other enforcement actions that View2Earn determines are eligible for review. Certain decisions, particularly those involving serious fraud, legal obligations, platform security, or criminal activity, may not be eligible for appeal.\"}]\n56:[\"$\",\"h3\",\"88\",{\"className\":\"pi-policy-s\",\"children\":\"7.2 How to Submit an Appeal\"}]\n57:[\"$\",\"p\",\"89\",{\"className\":\"pi-policy-p\",\"children\":\"Appeals should be submitted through the official support channels provided by View2Earn. When submitting an appeal, users should provide their account information, a clear description of the decision being challenged, any relevant evidence or supporting documentation, and any additional information that may assist "])</script><script>self.__next_f.push([1,"in the review. Providing false, misleading, or fabricated information during an appeal may result in additional enforcement actions.\"}]\n58:[\"$\",\"h3\",\"90\",{\"className\":\"pi-policy-s\",\"children\":\"7.3 Review Process\"}]\n59:[\"$\",\"p\",\"91\",{\"className\":\"pi-policy-p\",\"children\":\"Each eligible appeal will be reviewed by authorized members of the View2Earn team. During the review process, we may consider the information provided by the user, account history, investigation records, technical and security data, evidence collected during the original investigation, and any newly submitted evidence. Additional information may be requested if necessary before a final decision is made.\"}]\n5a:[\"$\",\"h3\",\"92\",{\"className\":\"pi-policy-s\",\"children\":\"7.4 Decision on Appeal\"}]\n5b:[\"$\",\"p\",\"93\",{\"className\":\"pi-policy-p\",\"children\":\"After completing the review, View2Earn may uphold the original enforcement action, modify the enforcement action, reverse the enforcement action, restore eligible Reward Points or rewards where appropriate, or take any other action considered reasonable under the circumstances. The decision reached after an appeal will generally be considered final, except where additional evidence or legal obligations require further review.\"}]\n5c:[\"$\",\"h3\",\"94\",{\"className\":\"pi-policy-s\",\"children\":\"7.5 Timeframe\"}]\n5d:[\"$\",\"p\",\"95\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn will make reasonable efforts to review appeals within a reasonable period. The time required may vary depending on the complexity of the case, the availability of relevant information, ongoing investigations, and legal or regulatory requirements.\"}]\n5e:[\"$\",\"h3\",\"96\",{\"className\":\"pi-policy-s\",\"children\":\"7.6 Abuse of the Appeals Process\"}]\n5f:[\"$\",\"p\",\"97\",{\"className\":\"pi-policy-p\",\"children\":\"Users must not misuse the appeals process by submitting repeated appeals without new information, providing false or misleading evidence, harassing or threatening View2Earn personnel, or attempting to interfere with or influence the review process. Abuse o"])</script><script>self.__next_f.push([1,"f the appeals process may result in additional restrictions or enforcement actions.\"}]\n60:[\"$\",\"h3\",\"98\",{\"className\":\"pi-policy-s\",\"children\":\"7.7 Fairness and Consistency\"}]\n61:[\"$\",\"p\",\"99\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn strives to review appeals objectively, fairly, and consistently while protecting the integrity of the Service, our users, advertisers, survey providers, business partners, and the broader View2Earn ecosystem. Nothing in this section limits View2Earn's right to take immediate action where necessary to protect platform security, comply with legal obligations, or prevent fraud.\"}]\n62:[\"$\",\"h2\",\"100\",{\"className\":\"pi-policy-h\",\"children\":\"8. Reporting Fraud\"}]\n63:[\"$\",\"p\",\"101\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn encourages users, advertisers, survey providers, business partners, and members of the public to report suspected fraudulent, deceptive, abusive, or unauthorized activities that may affect the security, fairness, or integrity of the Service. Timely reporting helps us investigate potential violations, protect legitimate users, and maintain a trusted platform.\"}]\n64:[\"$\",\"h3\",\"102\",{\"className\":\"pi-policy-s\",\"children\":\"8.1 What Should Be Reported\"}]\n65:[\"$\",\"p\",\"103\",{\"className\":\"pi-policy-p\",\"children\":\"Reports may include, but are not limited to, multiple-account abuse, identity impersonation or account theft, fake referrals or referral manipulation, fraudulent reward claims, submission of false or manipulated evidence, survey or advertising fraud, use of bots/scripts/automation tools or other unauthorized technologies, attempts to exploit platform vulnerabilities, suspicious account activity, and any other conduct that may violate this Anti-Fraud Policy, our Terms of Service, or applicable laws.\"}]\n66:[\"$\",\"h3\",\"104\",{\"className\":\"pi-policy-s\",\"children\":\"8.2 How to nd the requirements of this Policy and applicable law.\"}]\n6e:[\"$\",\"h3\",\"112\",{\"className\":\"pi-policy-s\",\"children\":\"8.6 Protection Against Retaliation\"}]\n6f:[\"$\",\"p\",\"113\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn does not tolerate retaliation against any individual who, in good faith, reports suspected fraud or cooperates with a legitimate investigation. However, this protection"])</script><script>self.__next_f.push([1," does not apply to individuals who knowingly submit false reports or participate in fraudulent or abusive activities.\"}]\n70:[\"$\",\"h3\",\"114\",{\"className\":\"pi-policy-s\",\"children\":\"8.7 Emergency Security Issues\"}]\n71:[\"$\",\"p\",\"115\",{\"className\":\"pi-policy-p\",\"children\":\"If you believe that a security vulnerability or active fraud presents an immediate risk to the Service, users, advertisers, or business partners, please notify View2Earn as soon as possible through our official security contact: security@view2earn.org. We appreciate responsible and timely reporting and will investigate credible security concerns as quickly as reasonably possible.\"}]\n72:[\"$\",\"h2\",\"116\",{\"className\":\"pi-policy-h\",\"children\":\"9. Cooperation with Third Parties\"}]\n73:[\"$\",\"p\",\"117\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn recognizes that preventing and investigating fraud may require cooperation with trusted third parties. Where appropriate and permitted by applicable law, we may work with service providers, advertisers, survey providers, business partners, blockchain ecosystem operators, payment providers, regulatory authorities, and law enforcement agencies to protect the integrity, security, and fairness of the Service. Any cooperation will be carried out responsibly and in accordance with our Privacy Policy, Terms of Service, applicable laws, and contractual obligations.\"}]\n74:[\"$\",\"h3\",\"118\",{\"className\":\"pi-policy-s\",\"children\":\"9.1 Trusted Service Providers\"}]\n75:[\"$\",\"p\",\"119\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn may cooperate with trusted service providers that assist us in fraud detection and prevention, identity and account verification, platform security, cloud infrastructure and hosting, analytics and system monitoring, reward fulfillment, customer support, and technical investigations. These providers may receive only the information reasonably necessary to perform their services and are expected to maintain appropriate confidentiality and security standards.\"}]\n76:[\"$\",\"h3\",\"120\",{\"className\":\"pi-policy"])</script><script>self.__next_f.push([1,"-s\",\"children\":\"9.2 Advertisers and Survey Providers\"}]\n77:[\"$\",\"p\",\"121\",{\"className\":\"pi-policy-p\",\"children\":\"To protect the integrity of advertising campaigns, surveys, and promotional activities, View2Earn may cooperate with advertisers, survey providers, and reward partners to verify task completion and eligibility, detect invalid traffic or fraudulent participation, investigate suspicious reward claims, prevent duplicate participation, and protect campaign integrity. Information shared for these purposes will be limited to what is reasonably necessary and consistent with applicable law.\"}]\n78:[\"$\",\"h3\",\"122\",{\"className\":\"pi-policy-s\",\"children\":\"9.3 Blockchain Ecosystem Operators\"}]\n79:[\"$\",\"p\",\"123\",{\"className\":\"pi-policy-p\",\"children\":\"Where fraud or abuse involves supported blockchain ecosystems, View2Earn may cooperate with the relevant blockchain ecosystem operators or authorized service providers, including Pi Network, Sidra Chain, or other supported ecosystems. Such cooperation may include verifying compliance with ecosystem rules, investigating suspected abuse, or protecting the integrity of blockchain-related activities. View2Earn respects the independence of each blockchain ecosystem and does not control their governance, policies, or enforcement decisions.\"}]\n7a:[\"$\",\"h3\",\"124\",{\"className\":\"pi-policy-s\",\"children\":\"9.4 Regulatory and Law Enforcement Authorities\"}]\n7b:[\"$\",\"p\",\"125\",{\"className\":\"pi-policy-p\",\"children\":\"Where required or permitted by applicable law, View2Earn may cooperate with courts, regulatory authorities, government agencies, or law enforcement in connection with investigations involving suspected fraud, financial crime, cybercrime, or other unlawful activities. Such cooperation may include responding to lawful requests, preserving relevant records, or providing information required by applicable law.\"}]\n7c:[\"$\",\"h3\",\"126\",{\"className\":\"pi-policy-s\",\"children\":\"9.5 Protection of Privacy\"}]\n7d:[\"$\",\"p\",\"127\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn is committed to "])</script><script>self.__next_f.push([1,"protecting user privacy during all forms of cooperation with third parties. We will make reasonable efforts to ensure that only the minimum information reasonably necessary is shared, information is disclosed only for legitimate purposes, appropriate safeguards are applied to protect personal information, and any disclosure complies with applicable law and our Privacy Policy.\"}]\n7e:[\"$\",\"h3\",\"128\",{\"className\":\"pi-policy-s\",\"children\":\"9.6 Reservation of Rights\"}]\n7f:[\"$\",\"p\",\"129\",{\"className\":\"pi-policy-p\",\"children\":\"Nothing in this Policy requires View2Earn to disclose confidential security procedures, fraud detection methods, proprietary technologies, internal investigations, or information that could compromise the safety, security, or integrity of the Service. View2Earn reserves the right to determine the appropriate scope of cooperation in each case, subject to applicable law and our contractual obligations.\"}]\n80:[\"$\",\"h2\",\"130\",{\"className\":\"pi-policy-h\",\"children\":\"10. User Responsibilities\"}]\n81:[\"$\",\"p\",\"131\",{\"className\":\"pi-policy-p\",\"children\":\"All users of View2Earn are responsible for using the Service honestly, responsibly, and in compliance with this Anti-Fraud Policy, our Terms of Service, Privacy Policy, and all other applicable platform policies. Users are expected to contribute to a safe, fair, and trustworthy environment for the benefit of the entire View2Earn community.\"}]\n82:[\"$\",\"h3\",\"132\",{\"className\":\"pi-policy-s\",\"children\":\"10.1 Accurate Information\"}]\n83:[\"$\",\"p\",\"133\",{\"className\":\"pi-policy-p\",\"children\":\"Users must provide accurate, complete, and truthful information when creating and maintaining their accounts. Users are responsible for keeping their account information up to date and must not provide false, misleading, or fraudulent information.\"}]\n84:[\"$\",\"h3\",\"134\",{\"className\":\"pi-policy-s\",\"children\":\"10.2 Account Security\"}]\n85:[\"$\",\"p\",\"135\",{\"className\":\"pi-policy-p\",\"children\":\"Users are responsible for maintaining the confidentiality and security of their account cre"])</script><script>self.__next_f.push([1,"dentials. Users should use strong and unique passwords, protect their login credentials from unauthorized access, enable additional security features where available, and notify View2Earn immediately if they suspect unauthorized access to their account. Users are responsible for activities performed through their accounts unless otherwise required by applicable law.\"}]\n86:[\"$\",\"h3\",\"136\",{\"className\":\"pi-policy-s\",\"children\":\"10.3 Compliance with Platform Policies\"}]\n87:[\"$\",\"p\",\"137\",{\"className\":\"pi-policy-p\",\"children\":\"Users must comply with this Anti-Fraud Policy, the Terms of Service, the Privacy Policy, the Cookie Policy, and any additional policies, guidelines, or rules published by View2Earn. Failure to comply with these policies may result in enforcement action.\"}]\n88:[\"$\",\"h3\",\"138\",{\"className\":\"pi-policy-s\",\"children\":\"10.4 Honest Participation\"}]\n89:[\"$\",\"p\"  a shared responsibility between View2Earn and its users. View2Earn is committed to providing effective fraud prevention measures, while users are expected to act honestly, responsibly, and in accordance with this Policy.\"}]\n92:[\"$\",\"h2\",\"148\",{\"className\":\"pi-policy-h\",\"children\":\"11. Changes to This Anti-Fraud Policy\"}]\n93:[\"$\",\"p\",\"149\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn may update this Anti-Fraud Policy from time to time to reflect changes in our Services, fraud prevention practices, technologies, legal obligations, industry standards, or business operations. We are committed to maintaining transparency and will make reasonable efforts to keep users informed of significant changes to this Policy.\"}]\n94:[\"$\",\"h3\",\"150\",{\"className\":\"pi-policy-s\",\"children\":\"11.1 Reasons for Updates\"}]\n95:[\"$\",\"p\",\"151\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn may revise this Anti-Fraud Policy for reasons including, but not limited to, introducing new features/products/services, responding to emerging fraud techniques or security threats, improving fraud detection/prevention/investigation procedures, complying with new laws/regulations/court decisions/regulatory guidance, reflecting changes in our business operations/partnerships/supported technologies, and clarifying or improving existing provisions for greater transparency and consistency.\"}]\n96:[\"$\",\"h"])</script><script>self.__next_f.push([1,"3\",\"152\",{\"className\":\"pi-policy-s\",\"children\":\"11.2 Notification of Changes\"}]\n97:[\"$\",\"p\",\"153\",{\"className\":\"pi-policy-p\",\"children\":\"When material changes are made to this Anti-Fraud Policy, View2Earn may notify users through one or more of the following methods: publishing the updated Policy on the View2Earn website or mobile application, displaying an in-app notification, sending an email to the registered email address associated with the user's account (where appropriate), or using any other communication method that View2Earn reasonably considers appropriate. Minor editorial, formatting, or administrative changes that do not materially affect users' rights or responsibilities may be made without individual notice.\"}]\n98:[\"$\",\"h3\",\"154\",{\"className\":\"pi-policy-s\",\"children\":\"11.3 Effective Date\"}]\n99:[\"$\",\"p\",\"155\",{\"className\":\"pi-policy-p\",\"children\":\"The most current version of this Anti-Fraud Policy will always display a \\\"Last Updated\\\" date at the beginning of the document. Unless otherwise required by applicable law, updates become effective upon publication. Where required by law or where changes materially affect users, View2Earn may provide advance notice before the updated Policy takes effect.\"}]\n9a:[\"$\",\"h3\",\"156\",{\"className\":\"pi-policy-s\",\"children\":\"11.4 Continued Use of the Service\"}]\n9b:[\"$\",\"p\",\"157\",{\"className\":\"pi-policy-p\",\"children\":\"By continuing to access or use the Service after an updated Anti-Fraud Policy becomes effective, you acknowledge that you have been informed of the revised Policy and agree to comply with it. If you do not agree with the updated Policy, you should discontinue using the Service and may close your account in accordance with our Terms of Service.\"}]\n9c:[\"$\",\"h3\",\"158\",{\"className\":\"pi-policy-s\",\"children\":\"11.5 Reservation of Rights\"}]\n9d:[\"$\",\"p\",\"159\",{\"className\":\"pi-policy-p\",\"children\":\"Nothing in this section limits View2Earn's ability to take immediate action to protect the Service, its users, advertisers, survey providers, business partners, or the"])</script><script>self.__next_f.push([1," broader platform ecosystem where necessary to address fraud, security threats, legal obligations, or other urgent circumstances.\"}]\n9e:[\"$\",\"h2\",\"160\",{\"className\":\"pi-policy-h\",\"children\":\"12. Contact Information\"}]\n9f:[\"$\",\"p\",\"161\",{\"className\":\"pi-policy-p\",\"childr
