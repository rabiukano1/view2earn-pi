ligibility for every campaign, task, survey, or promotional offer, as additional criteria may apply.\"}]\n8:[\"$\",\"h3\",\"10\",{\"className\":\"pi-policy-s\",\"children\":\"2.1 Account Eligibility\"}]\n9:[\"$\",\"p\",\"11\",{\"className\":\"pi-policy-p\",\"children\":\"To participate in the rewards program, users must maintain an active and valid View2Earn account, be at least 18 years of age or the minimum legal age required in their jurisdiction, provide accurate/complete/truthful account information, comply with the View2Earn Terms of Service, Privacy Policy, Cookie Policy, Anti-Fraud Policy, and this Rewards \u0026 Redemption Policy, and successfully complete any verification procedures required by View2Earn.\"}]\na:[\"$\",\"p\",\"12\",{\"className\":\"pi-policy-p\",\"children\":\"Accounts that are suspended, restricted, terminated, or under investigation may not be eligible to earn or redeem rewards.\"}]\nb:[\"$\",\"h3\",\"13\",{\"className\":\"pi-policy-s\",\"children\":\"2.2 Campaign Eligibility\"}]\nc:[\"$\",\"p\",\"14\",{\"className\":\"pi-policy-p\",\"children\":\"Certain rewards, surveys, advertisements, promotions, or special campaigns may have additional eligibility requirements, including country or regional availability, language requirements, age restrictions, device compatibility, account verification status, advertiser or survey provider requirements, and cam"])</script><script>self.__next_f.push([1,"paign-specific participation rules. Users are responsible for reviewing and complying with all campaign requirements before participating.\"}]\nd:[\"$\",\"h3\",\"15\",{\"className\":\"pi-policy-s\",\"children\":\"2.3 Good Standing\"}]\ne:[\"$\",\"p\",\"16\",{\"className\":\"pi-policy-p\",\"children\":\"To remain eligible for rewards, users must maintain their accounts in good standing. Users may become ineligible if they violate platform policies, engage in fraudulent or abusive activities, submit false or misleading information, attempt to manipulate the rewards system, or fail to satisfy verification requirements. View2Earn reserves the right to suspend or revoke eligibility where there is reasonable evidence of policy violations or misuse of the Service.\"}]\nf:[\"$\",\"h3\",\"17\",{\"className\":\"pi-policy-s\",\"children\":\"2.4 Verification Requirements\"}]\n10:[\"$\",\"p\",\"18\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn may require users to complete identity, account, device, or activity verification before allowing them to earn or redeem rewards. Verification requirements may vary depending on the type of reward, reward value, geographic location, applicable legal or regulatory requirements, and fraud risk assessment. Failure to complete required verification may result in delayed, restricted, or denied participation in the rewards program.\"}]\n11:[\"$\",\"h3\",\"19\",{\"className\":\"pi-policy-s\",\"children\":\"2.5 Independent Eligibility Decisions\"}]\n12:[\"$\",\"p\",\"20\",{\"className\":\"pi-policy-p\",\"children\":\"Eligibility for rewards is determined solely by View2Earn and, where applicable, by advertisers, survey providers, or other authorized partners. Participation in one campaign or successful completion of previous activities does not guarantee eligibility for future opportunities. View2Earn reserves the right to determine, verify, or revoke eligibility at any time where necessary to protect the integrity, security, fairness, or lawful operation of the rewards program.\"}]\n13:[\"$\",\"h2\",\"21\",{\"className\":\"pi-policy-h\",\"children\":\"3. Earning Reward Points\"}]\n14:[\"$"])</script><script>self.__next_f.push([1,"\",\"p\",\"22\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn rewards users for completing eligible activities that contribute to the growth, engagement, and integrity of the platform. Reward Points are earned only after the successful completion and verification of qualifying activities in accordance with this Policy and any applicable campaign rules. Reward Points are promotional loyalty points and do not represent money, cryptocurrency, securities, or any other financial instrument.\"}]\n15:[\"$\",\"h3\",\"23\",{\"className\":\"pi-policy-s\",\"children\":\"3.1 Eligible Activities\"}]\n"])</script><script>self.__next_f.push([1,"16:[\"$\",\"p\",\"24\",{\"className\":\"pi-policy-p\",\"children\":\"Users may earn Reward Points by participating in eligible activities made available through the Service, including but not limited to completing surveys, watching advertisements or promotional content, following or engaging with approved social media campaigns, completing promotional tasks, inviting eligible users through the referral program, participating in quizzes/contests/special events, completing bonus missions or achievement programs, and participating in future activities introduced by View2Earn. The availability of activities may vary by country, device, language, account status, advertiser requirements, and other eligibility criteria.\"}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"h3\",\"25\",{\"className\":\"pi-policy-s\",\"children\":\"3.2 Completion Requirements\"}]\n18:[\"$\",\"p\",\"26\",{\"className\":\"pi-policy-p\",\"children\":\"Reward Points are awarded only when all applicable requirements have been successfully completed. Depending on the activity, users may be required to complete every required step, follow all campaign instructions, meet advertiser or survey provider requirements, successfully pass validation or verification checks, and maintain compliance with all View2Earn policies. Incomplete, inaccurate, or invalid activity may not qualify for Reward Points.\"}]\n19:[\"$\",\"h3\",\"27\",{\"className\":\"pi-policy-s\",\"children\":\"3.3 Verification Before Awarding Points\"}]\n1a:[\"$\",\"p\",\"28\",{\"className\":\"pi-policy-p\",\"children\":\"All eligible activities are subject to verification before Reward Points are credited. Verification may be performed by View2Earn, advertisers, survey providers, reward partners, automated verification systems, or manual review by authorized personnel. Reward Points will only be credited after successful verification has been completed.\"}]\n1b:[\"$\",\"h3\",\"29\",{\"className\":\"pi-policy-s\",\"children\":\"3.4 Pending Reward Points\"}]\n1c:[\"$\",\"p\",\"30\",{\"className\":\"pi-policy-p\",\"children\":\"Some Reward Points may initially appear as Pending while verification is in progress. Pending points are not yet available for redemption, may remain pending until advertiser or partner confirmation is received, may be adjusted/approved/rejected following verification, and do not guarantee final approval. The verification period may vary depending on the campaign or partner requirements.\"}]\n1d:[\"$\",\"h3\",\"31\",{\"className\":\"pi-policy-s\",\"children\":\"3.5 Promotional Bonuses\"}]\n1e:[\"$\",\"p\",\"32\",{\"className\":\"pi-policy-p\",\"children\":\"From time to time, View2Earn may offer promotional bonuses, limited-time campaigns, referral incentives, seasonal events, loyalty rewards, or other special earning opportunities. Each promotion may have its own eligibility requirements, participation rules, earning limits, valid"])</script><script>self.__next_f.push([1,"ity period, and redemption conditions. Unless otherwise stated, promotional bonuses are governed by this Policy in addition to the specific terms of the relevant promotion.\"}]\n1f:[\"$\",\"h3\",\"33\",{\"className\":\"pi-policy-s\",\"children\":\"3.6 Situations Where Points May Not Be Awarded\"}]\n20:[\"$\",\"p\",\"34\",{\"className\":\"pi-policy-p\",\"children\":\"Reward Points may be refused, delayed, adjusted, or cancelled where activity cannot be verified, campaign requirements are not fully completed, the advertiser or survey provider rejects the activity, duplicate participation is detected, fraudulent or abusive activity is identified, technical errors invalidate the activity, or platform policies or campaign rules have been violated. View2Earn's decision regarding the awarding of Reward Points will be based on the available evidence, verification results, and applicable campaign requirements.\"}]\n21:[\"$\",\"h3\",\"35\",{\"className\":\"pi-policy-s\",\"children\":\"3.7 No Guarantee of Earnings\"}]\n22:[\"$\",\"p\",\"36\",{\"className\":\"pi-policy-p\",\"children\":\"The availability of earning opportunities may change at any time. View2Earn does not guarantee a minimum number of available tasks or surveys, continuous availability of earning opportunities, approval of every completed activity, or a specific amount of Reward Points or rewards. Earning opportunities depend on factors including advertiser demand, campaign availability, geographic eligibility, verification results, user qualification, and platform operations.\"}]\n23:[\"$\",\"h3\",\"37\",{\"className\":\"pi-policy-s\",\"children\":\"3.8 Platform Discretion\"}]\n24:[\"$\",\"p\",\"38\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn reserves the right to introduce, modify, suspend, or discontinue earning opportunities, promotional campaigns, bonus programs, reward rates, or eligibility requirements at any time. Such changes may be made to improve the Service, prevent fraud, comply with legal obligations, respond to business needs, or protect the integrity of the rewards program.\"}]\n25:[\"$\",\"h2\",\"39\",{\"className\":\"pi-policy-"])</script><script>self.__next_f.push([1,"h\",\"children\":\"4. Reward Verification\"}]\n26:[\"$\",\"p\",\"40\",{\"className\":\"pi-policy-p\",\"children\":\"To maintain a fair, secure, and reliable rewards program, all Reward Points and reward claims are subject to verification before they are approved or made available for redemption. Verification helps ensure that rewards are issued only for genuine, eligible, and successfully completed activities while protecting the interests of users, advertisers, survey providers, business partners, and the View2Earn platform.\"}]\n27:[\"$\",\"h3\",\"41\",{\"className\":\"pi-policy-s\",\"children\":\"4.1 Verification Process\"}]\n28:[\"$\",\"p\",\"42\",{\"className\":\"pi-policy-p\",\"children\":\"Before Reward Points are awarded, View2Earn may verify that the activity was completed successfully, all campaign requirements were satisfied, the user met the applicable eligibility criteria, no fraudulent/deceptive/abusive activity occurred, and the activity complies with this Policy and all other applicable platform policies. Verification requirements may vary depending on the activity, reward type, campaign, or partner.\"}]\n29:[\"$\",\"h3\",\"43\",{\"className\":\"pi-policy-s\",\"children\":\"4.2 Verification Methods\"}]\n2a:[\"$\",\"p\",\"44\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn may use one or more verification methods, including automated validation systems, manual review by authorized personnel, advertiser confirmation, survey provider validation, referral verification, device and security checks, activity and behavioral analysis, and additional verification procedures where reasonably necessary. The verification method used may differ depending on the nature and risk level of the activity.\"}]\n2b:[\"$\",\"h3\",\"45\",{\"className\":\"pi-policy-s\",\"children\":\"4.3 Pending Verification\"}]\n2c:[\"$\",\"p\",\"46\",{\"className\":\"pi-policy-p\",\"children\":\"Reward Points may remain in a Pending status while verification is being completed. Pending Reward Points cannot be redeemed or transferred, may be approved/adjusted/delayed/rejected, do not guarantee final approval, and may remain pending unt"])</script><script>self.__next_f.push([1,"il confirmation is received from the relevant advertiser, survey provider, or other authorized partner. Users should not assume that pending Reward Points have been permanently earned until they are officially approved.\"}]\n2d:[\"$\",\"h3\",\"47\",{\"className\":\"pi-policy-s\",\"children\":\"4.4 Additional Verification\"}]\n2e:[\"$\",\"p\",\"48\",{\"className\":\"pi-policy-p\",\"children\":\"Where necessary, View2Earn may request additional information or verification before approving rewards. This may include identity verification, account ownership confirmation, device verification, confirmation of task completion, and supporting documentation where appropriate. Failure to complete requested verification within a reasonable period may result in delayed or rejected rewards.\"}]\n2f:[\"$\",\"h3\",\"49\",{\"className\":\"pi-policy-s\",\"children\":\"4.5 Verification Timeframes\"}]\n30:[\"$\",\"p\",\"50\",{\"className\":\"pi-policy-p\",\"children\":\"Verification times may vary depending on the type of activity, advertiser or survey provider processing times, campaign requirements, fraud prevention reviews, and technical or operational factors. While View2Earn aims to process verifications as efficiently as possible, we cannot guarantee that all rewards will be verified within a specific timeframe.\"}]\n31:[\"$\",\"h3\",\"51\",{\"className\":\"pi-policy-s\",\"children\":\"4.6 Rejected Activities\"}]\n32:[\"$\",\"p\",\"52\",{\"className\":\"pi-policy-p\",\"children\":\"Reward Points may be rejected if the activity fails verification, campaign requirements were not satisfied, duplicate participation is detected, fraudulent or suspicious activity is identified, the advertiser or survey provider declines the activity, or platform policies have been violated. Where appropriate, users may contact View2Earn Support if they believe a verification decision was made in error.\"}]\n33:[\"$\",\"h3\",\"53\",{\"className\":\"pi-policy-s\",\"children\":\"4.7 Final Verification Decisions\"}]\n34:[\"$\",\"p\",\"54\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn reserves the right to make the final determination regarding reward verificat"])</script><script>self.__next_f.push([1,"ion after considering all available evidence, verification results, partner feedback, and applicable platform policies. Verification decisions are made in good faith to protect the integrity, fairness, and sustainability of the rewards program and may be subject to review under our applicable appeals process where eligible.\"}]\n35:[\"$\",\"h2\",\"55\",{\"className\":\"pi-policy-h\",\"children\":\"5. Reward Point Balances\"}]\n36:[\"$\",\"p\",\"56\",{\"className\":\"pi-policy-p\",\"children\":\"View2Earn provides users with a Reward Point balance that reflects their participation in eligible activities and approved rewards. Users are responsible for reviewing their balances regularly and notifying View2Earn of any suspected discrepancies. Reward Point balances are maintained electronically within the Service and are subject to verification, adjustments, and applicable platform policies.\"}]\n37:[\"$\",\"h3\",\"57\",{\"className\":\"pi-policy-s\",\"children\":\"5.1 Balance Categories\"}]\n38:[\"$\",\"p\",\"58\",{\"className\":\"pi-policy-p\",\"children\":\"Your Reward Point balance may include one or more of the following categories: Available Points (successfully verified and eligible for redemption), Pending Points (awaiting verification or approval; not available for redemption and may be approved, adjusted, delayed, or rejected), and Adjusted Points (added or deducted as a result of corrections, fraud investigations, promotional updates, technical issues, or administrative actions). Where applicable, the Service may display these categories separately to provide greater transparency.\"}]\n39:[\"$\",\"h3\",\"59\",{\"className\":\"pi-policy-s\",\"children\":\"5.2 Balance Updates\"}]\n3a:[\"$\",\"p\",\"60\",{\"className\":\"pi-policy-p\",\"children\":\"Reward Point balances may be updated when a qualifying activity has been successfully verified, a reward has been redeemed, a promotional bonus has been awarded, pending Reward Points are approved or rejected, administrative corrections are required, fraudulent or invalid activities are identified, or other adjustments are made in accordance
